<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adult LMPP Flowchart Case Generator</title>
  <style>
    :root { --primary: #1e40af; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 650px; margin: 30px auto; padding: 0 20px; line-height: 1.4; }
    .card { background: var(--card); border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .vertical-list { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; }
    .lab-item { background: #f1f5f9; padding: 10px 14px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .lab-item span { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .flag { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 8px; text-transform: uppercase; }
    .flag-high { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .flag-low { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
    button { padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; transition: all 0.2s; }
    button:hover { background: #f1f5f9; border-color: #94a3b8; }
    button.primary { background: var(--primary); color: white; border: none; }
    button.primary:hover { background: #1d4ed8; }
    .feedback { margin-top: 20px; padding: 16px; border-radius: 8px; font-weight: 500; display: none; }
    .correct { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .incorrect { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .comment-list { margin-top: 8px; padding-left: 0; list-style: none; }
    .comment-item { background: #e0e7ff; color: #1e1b4b; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-weight: 600; }
  </style>
</head>
<body>

  <h2>Adult LMPP Decision Chart Practice Simulator</h2>
  
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="margin: 0;">Patient Case Profile</h3>
      <button onclick="generateCase()" class="primary">Generate New Case</button>
    </div>

    <div class="vertical-list" id="lab-list"></div>

    <p><strong>Determine the Classification / Phenotype:</strong></p>
    <div class="btn-group">
      <button onclick="checkAnswer('Normal')">Normal</button>
      <button onclick="checkAnswer('Type I')">Type I</button>
      <button onclick="checkAnswer('Type IIa')">Type IIa</button>
      <button onclick="checkAnswer('Mild Type IIa')">Mild Type IIa</button>
      <button onclick="checkAnswer('Type IIb')">Type IIb</button>
      <button onclick="checkAnswer('Mild Type IIb')">Mild Type IIb</button>
      <button onclick="checkAnswer('Type III')">Type III</button>
      <button onclick="checkAnswer('Mild Type III')">Mild Type III</button>
      <button onclick="checkAnswer('Type IV')">Type IV</button>
      <button onclick="checkAnswer('Mild Type IV')">Mild Type IV</button>
      <button onclick="checkAnswer('Type V')">Type V</button>
      <button onclick="checkAnswer('Mild Int IV/V')">Mild Int IV/V</button>
      <button onclick="checkAnswer('Int IV/V')">Int IV/V</button>
      <button onclick="checkAnswer('LpX Cholestatic')">LpX Cholestatic Pattern</button>
      <button onclick="checkAnswer('Not a Fredrickson Phenotype')">Not a Fredrickson Phenotype</button>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>

<script>
  // Full Biochemistry Comments Dictionary from Decision Chart
  const cvDescriptions = {
    "CV55": "Not a Fredrickson Phenotype",
    "CV56": "Intermediate between Mild Type IV and Type V",
    "CV57": "Intermediate between Type IV & Type V",
    "CV59": "Increased IDL comment",
    "CV60": "Non-fasting comment",
    "CV61": "Secondary causes of hypertriglyceridemia...",
    "CV62": "FH comment (≥ 190 LDL Type IIa)",
    "CV63": "FCH comment (≥ 190 LDL Type IIb)",
    "CV64": "LpX comment LDL cholesterol",
    "CV66": "Apo E genotyping comment",
    "CV67": "FCH comment (Mild IIb; LDL 160-189 & elev tgs)",
    "CV69": "Secondary causes of low HDL comment",
    "CV70": "Low lipids comment",
    "CV71": "Low lipids comment",
    "CV72": "Trig blank comment",
    "CV73": "Trait for mild II comment",
    "CV74": "Trait for II comment",
    "CV75": "PEDS FH comment",
    "CV114": "LpX comment LDL triglyceride"
  };

  let currentCase = {};

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // Pick a target phenotype based on exact probability weights
  function getWeightedTarget() {
    const weights = [
      { target: "Type IIb", weight: 25 },
      { target: "Type IV", weight: 25 },
      { target: "Normal", weight: 10 },
      { target: "Not Fredrickson", weight: 10 },
      { target: "Type IIa", weight: 10 },
      { target: "Type III", weight: 10 },
      { target: "Type I", weight: 5 },
      { target: "Type V", weight: 5 }
    ];

    const totalWeight = weights.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Math.random() * totalWeight;

    for (let item of weights) {
      if (randomNum < item.weight) return item.target;
      randomNum -= item.weight;
    }
    return "Type IIb";
  }

  function generateCase() {
    let target = getWeightedTarget();

    let age = rand(18, 85);
    let sex = Math.random() < 0.5 ? 'Male' : 'Female';
    let cDiff = rand(-17, 17);
    let lpx = false;
    let bVldlC = 0;
    let bVldlTg = 0;
    let chyloTg = 0;
    let chyloC = 0;
    let ldlC = 100;
    let vldlTg = 100;
    let biochemTrig = 150;
    let ldlTg = 25;
    let hdlC = 50;
    let lpla = rand(1, 40);
    let apob = rand(40, 160);
    let vldlC = 20;

    // Tailor random lab generation to match target phenotype decision rules
    switch (target) {
      case "Normal":
        ldlC = rand(70, 125);
        vldlTg = rand(50, 115);
        biochemTrig = rand(80, 140);
        break;

      case "Not Fredrickson":
        ldlC = rand(20, 29);
        vldlTg = rand(50, 115);
        biochemTrig = rand(60, 130);
        break;

      case "Type I":
        biochemTrig = rand(10001, 14000);
        chyloTg = rand(400, 1200);
        chyloC = rand(50, 150);
        ldlC = rand(40, 80);
        vldlTg = rand(50, 100);
        break;

      case "Type IIa":
        ldlC = rand(191, 240);
        vldlTg = rand(50, 115);
        biochemTrig = rand(90, 145);
        break;

      case "Type IIb":
        ldlC = rand(160, 220);
        vldlTg = rand(125, 350);
        biochemTrig = rand(200, 450);
        break;

      case "Type III":
        bVldlC = rand(30, 60);
        bVldlTg = rand(20, 50);
        ldlC = rand(80, 120);
        vldlTg = rand(150, 350);
        biochemTrig = rand(250, 500);
        break;

      case "Type IV":
        ldlC = rand(70, 125);
        vldlTg = rand(260, 500);
        biochemTrig = rand(250, 600);
        chyloTg = rand(0, 25);
        break;

      case "Type V":
        ldlC = rand(50, 110);
        vldlTg = rand(300, 600);
        chyloTg = rand(310, 800);
        chyloC = rand(40, 120);
        biochemTrig = rand(1000, 3000);
        break;
    }

    let tc = ldlC + hdlC + vldlC + chyloC;

    currentCase = evaluateFlowchart({
      age, sex, tc, biochemTrig, lpla, ldlC, ldlTg, apob, hdlC, vldlC, vldlTg,
      bVldlC, bVldlTg, chyloC, chyloTg, lpx, cDiff
    });

    renderLabs();
  }

  function evaluateFlowchart(labs) {
    let comments = [];
    let phenotype = "";
    let rationale = "";

    let cDiffStatus = "Accept";
    if (Math.abs(labs.cDiff) > 18.0) {
      if (labs.biochemTrig < 700) cDiffStatus = "Repeat";
      else cDiffStatus = "Review gel";
    }

    if (labs.lpx) {
      comments.push("CV64");
      phenotype = "LpX Cholestatic";
      rationale = "LpX positive overrides standard table (Step 2). Added comment CV64.";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }

    if (labs.bVldlC >= 30) {
      phenotype = "Type III";
      comments.push("CV66");
      rationale = "Beta-VLDL Cholesterol ≥ 30 mg/dL triggers Type III dysbetalipoproteinemia (Step 3). Added comment CV66.";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    } else if (labs.bVldlC >= 15 && labs.bVldlC < 30) {
      if (labs.vldlTg <= 250) phenotype = "Mild Type III";
      else phenotype = "Type III";
      comments.push("CV66");
      rationale = `Beta-VLDL Cholesterol between 15 and 29 mg/dL with VLDL-Tg of ${labs.vldlTg} mg/dL triggers ${phenotype} (Step 3). Added comment CV66.`;
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }

    if (labs.biochemTrig > 10000) {
      phenotype = "Type I";
      rationale = "Biochem Triglycerides > 10,000 mg/dL triggers Type I classification (Step 5c).";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }
    if (labs.biochemTrig > 500) comments.push("CV61");

    let correctedLdlC = labs.ldlC;
    let idlSubtracted = false;
    if (labs.ldlTg >= 50 && labs.ldlC >= 100 && (labs.ldlTg / labs.ldlC) >= 0.30) {
      let idl = labs.ldlTg - ((labs.ldlC - labs.ldlTg) / 3);
      correctedLdlC = labs.ldlC - idl;
      idlSubtracted = true;
      comments.push("CV59");
    }

    let gridRes = lookupGrid(correctedLdlC, labs.vldlTg, idlSubtracted);
    phenotype = gridRes.phenotype;
    comments.push(...gridRes.comments);

    if (labs.chyloTg >= 30 && labs.chyloTg <= 100) {
      comments.push("CV60");
    } else if (labs.chyloTg > 100) {
      if (["Type IV", "Type V", "Mild Int IV/V", "Int IV/V"].includes(phenotype)) {
        let chyloRes = evalChyloTable(labs.chyloTg, labs.vldlTg);
        phenotype = chyloRes.phenotype;
        comments.push(...chyloRes.comments);
      } else {
        comments.push("CV60");
      }
    }

    comments = [...new Set(comments)];
    rationale = gridRes.rationale + (idlSubtracted ? " IDL was subtracted per Step 7." : "");

    return { labs, phenotype, comments, rationale, cDiffStatus };
  }

  function lookupGrid(ldl, vldlTg, idlSubtracted) {
    let comments = [];
    let phenotype = "";
    let rationale = "";

    if (ldl < 30) {
      if (vldlTg < 120) { phenotype = "Not a Fredrickson Phenotype"; comments.push("CV55", "CV70"); }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 99) {
      if (vldlTg < 120) { phenotype = "Normal"; }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 129) {
      if (vldlTg < 120) { phenotype = "Normal"; }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 159) {
      if (vldlTg < 120) { phenotype = "Not a Fredrickson Phenotype"; comments.push("CV55"); }
      else if (vldlTg <= 250) { phenotype = "Mild Type IIb"; }
      else { phenotype = "Type IV"; comments.push("CV73"); }
    } else if (ldl <= 189) {
      if (vldlTg < 120) { phenotype = "Mild Type IIa"; }
      else {
        phenotype = "Mild Type IIb";
        comments.push("CV67");
      }
    } else {
      if (vldlTg < 120) {
        phenotype = "Type IIa";
        if (!idlSubtracted) comments.push("CV62");
      } else {
        phenotype = "Type IIb";
        if (!idlSubtracted) comments.push("CV63");
      }
    }

    rationale = `Mapped to [LDL: ${Math.round(ldl)}, VLDL-Tg: ${vldlTg}] on Profile Grid.`;
    return { phenotype, comments, rationale };
  }

  function evalChyloTable(chyloTg, vldlTg) {
    let comments = [];
    let phenotype = "";
    if (chyloTg < 100) {
      phenotype = "Type IV";
      comments.push("CV60");
    } else if (chyloTg <= 300) {
      if (vldlTg <= 250) phenotype = "Mild Int IV/V";
      else { phenotype = "Int IV/V"; comments.push("CV57", "CV61"); }
    } else {
      phenotype = "Type V";
      comments.push("CV61");
    }
    return { phenotype, comments };
  }

  function renderLabs() {
    const l = currentCase.labs;

    const isHigh = (val, threshold) => val > threshold;
    const isHdlLow = (hdl, sex) => (sex === 'Male' && hdl < 40) || (sex === 'Female' && hdl < 50);

    const labsDisplay = [
      { label: "Age", val: `${l.age}`, flag: "" },
      { label: "Sex", val: `${l.sex}`, flag: "" },
      { label: "Total Cholesterol", val: `${l.tc} mg/dL`, flag: isHigh(l.tc, 200) ? "HIGH" : "" },
      { label: "Total Triglycerides", val: `${l.biochemTrig} mg/dL`, flag: isHigh(l.biochemTrig, 150) ? "HIGH" : "" },
      { label: "Lp(a) Cholesterol", val: `${l.lpla} mg/dL`, flag: isHigh(l.lpla, 5) ? "HIGH" : "" },
      { label: "LDL Cholesterol", val: `${l.ldlC} mg/dL`, flag: isHigh(l.ldlC, 100) ? "HIGH" : "" },
      { label: "LDL Triglycerides", val: `${l.ldlTg} mg/dL`, flag: isHigh(l.ldlTg, 50) ? "HIGH" : "" },
      { label: "Apolipoprotein B", val: `${l.apob} mg/dL`, flag: isHigh(l.apob, 90) ? "HIGH" : "" },
      { label: "HDL Cholesterol", val: `${l.hdlC} mg/dL`, flag: isHdlLow(l.hdlC, l.sex) ? "LOW" : "" },
      { label: "VLDL Cholesterol", val: `${l.vldlC} mg/dL`, flag: isHigh(l.vldlC, 30) ? "HIGH" : "" },
      { label: "VLDL Triglycerides", val: `${l.vldlTg} mg/dL`, flag: isHigh(l.vldlTg, 120) ? "HIGH" : "" },
      { label: "Beta VLDL Cholesterol", val: `${l.bVldlC} mg/dL`, flag: isHigh(l.bVldlC, 15) ? "HIGH" : "" },
      { label: "Beta VLDL Triglycerides", val: `${l.bVldlTg} mg/dL`, flag: isHigh(l.bVldlTg, 15) ? "HIGH" : "" },
      { label: "Chylomicron Cholesterol", val: l.chyloC > 0 ? `${l.chyloC} mg/dL` : "Absent", flag: l.chyloC > 0 ? "HIGH" : "" },
      { label: "Chylomicron Triglycerides", val: l.chyloTg > 0 ? `${l.chyloTg} mg/dL` : "Absent", flag: l.chyloTg > 0 ? "HIGH" : "" },
      { label: "Lipoprotein X", val: l.lpx ? "POSITIVE" : "Negative", flag: l.lpx ? "HIGH" : "" },
      { label: "C-Diff Check", val: `${l.cDiff} (${currentCase.cDiffStatus})`, flag: "" }
    ];

    document.getElementById('lab-list').innerHTML = labsDisplay.map(d => {
      let flagSpan = "";
      if (d.flag === "HIGH") flagSpan = `<span class="flag flag-high">High</span>`;
      if (d.flag === "LOW") flagSpan = `<span class="flag flag-low">Low</span>`;

      return `
        <div class="lab-item">
          <span>${d.label}</span>
          <div>
            <strong>${d.val}</strong>
            ${flagSpan}
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('feedback').style.display = 'none';
  }

  function checkAnswer(selected) {
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';

    let commentListHtml = "<em>None</em>";
    if (currentCase.comments.length > 0) {
      commentListHtml = `<ul class="comment-list">` +
        currentCase.comments.map(c => `<li class="comment-item"><strong>${c}:</strong> ${cvDescriptions[c] || 'Comment'}</li>`).join('') +
        `</ul>`;
    }

    if (selected === currentCase.phenotype || (selected === "Type IV" && currentCase.phenotype.includes("IV"))) {
      fb.className = "feedback correct";
      fb.innerHTML = `<strong>Correct!</strong> Classification: <strong>${currentCase.phenotype}</strong><br><br>
                      <strong>Required BioChem Comments:</strong>${commentListHtml}<br>
                      <em>${currentCase.rationale}</em>`;
    } else {
      fb.className = "feedback incorrect";
      fb.innerHTML = `<strong>Incorrect.</strong> Decision flowchart yields: <strong>${currentCase.phenotype}</strong><br><br>
                      <strong>Required BioChem Comments:</strong>${commentListHtml}<br>
                      <em>${currentCase.rationale}</em>`;
    }
  }

  generateCase();
</script>
