<script>
  const cvDescriptions = {
    "CV55": "Not a Fredrickson Phenotype",
    "CV56": "Intermediate between Mild Type IV and Type V",
    "CV57": "Intermediate between Type IV & Type V",
    "CV59": "Increased IDL comment",
    "CV60": "Non-fasting comment",
    "CV61": "Secondary causes of hypertriglyceridemia...",
    "CV62": "FH comment (≥ 190 LDL Type IIa)",
    "CV63": "FCH comment (≥ 190 LDL Type IIb)",
    "CV64": "LpX comment LDL cholesterol",
    "CV66": "Apo E genotyping comment",
    "CV67": "FCH comment (Mild IIb; LDL 160-189 & elev tgs)",
    "CV69": "Secondary causes of low HDL comment",
    "CV70": "Low lipids comment",
    "CV71": "Low lipids comment",
    "CV72": "Trig blank comment",
    "CV73": "Trait for mild II comment",
    "CV74": "Trait for II comment",
    "CV75": "PEDS FH comment",
    "CV114": "LpX comment LDL triglyceride"
  };

  let currentCase = {};

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateCase() {
    let age = rand(18, 117);
    let sex = Math.random() < 0.5 ? 'Male' : 'Female';
    
    let cDiff = rand(-22, 22);
    let lpx = Math.random() < 0.08;
    let bVldlC = rand(0, 35);
    let bVldlTg = rand(0, 35);
    let ldlC = rand(20, 220);
    let vldlTg = rand(50, 400);
    let chyloTg = rand(0, 350);
    let chyloC = chyloTg > 0 ? rand(10, 100) : 0;
    let biochemTrig = rand(100, 5000);
    let ldlTg = rand(10, 80);
    let hdlC = rand(20, 70);
    let lpla = rand(1, 40);
    let apob = rand(40, 160);
    let vldlC = rand(10, 60);
    let tc = ldlC + hdlC + vldlC + chyloC;

    currentCase = evaluateFlowchart({
      age, sex, tc, biochemTrig, lpla, ldlC, ldlTg, apob, hdlC, vldlC, vldlTg,
      bVldlC, bVldlTg, chyloC, chyloTg, lpx, cDiff
    });

    renderLabs();
  }

  function evaluateFlowchart(labs) {
    let comments = [];
    let phenotype = "";
    let rationale = "";

    let cDiffStatus = "Accept";
    if (Math.abs(labs.cDiff) > 18.0) {
      if (labs.biochemTrig < 700) cDiffStatus = "Repeat";
      else cDiffStatus = "Review gel";
    }

    // Step 2: LpX Check
    if (labs.lpx) {
      comments.push("CV64");
      phenotype = "LpX Cholestatic";
      rationale = "LpX positive overrides standard table (Step 2). Added comment CV64.";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }

    // Step 3: Beta-VLDL Assessment (Fixed)
    if (labs.bVldlC >= 30) {
      phenotype = "Type III";
      comments.push("CV66");
      rationale = "Beta-VLDL Cholesterol ≥ 30 mg/dL triggers Type III dysbetalipoproteinemia (Step 3). Added comment CV66.";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    } else if (labs.bVldlC >= 15 && labs.bVldlC < 30) {
      if (labs.vldlTg <= 250) {
        phenotype = "Mild Type III";
      } else {
        phenotype = "Type III";
      }
      comments.push("CV66");
      rationale = `Beta-VLDL Cholesterol between 15 and 29 mg/dL with VLDL-Tg of ${labs.vldlTg} mg/dL triggers ${phenotype} (Step 3). Added comment CV66.`;
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }

    // Step 5: High Triglycerides Check
    if (labs.biochemTrig > 10000) {
      phenotype = "Type I";
      rationale = "Biochem Triglycerides > 10,000 mg/dL triggers Type I classification (Step 5c).";
      return { labs, phenotype, comments, rationale, cDiffStatus };
    }
    if (labs.biochemTrig > 500) comments.push("CV61");

    // Step 7: IDL Subtraction check
    let correctedLdlC = labs.ldlC;
    let idlSubtracted = false;
    if (labs.ldlTg >= 50 && labs.ldlC >= 100 && (labs.ldlTg / labs.ldlC) >= 0.30) {
      let idl = labs.ldlTg - ((labs.ldlC - labs.ldlTg) / 3);
      correctedLdlC = labs.ldlC - idl;
      idlSubtracted = true;
      comments.push("CV59");
    }

    // Step 6: Grid Lookup
    let gridRes = lookupGrid(correctedLdlC, labs.vldlTg, idlSubtracted);
    phenotype = gridRes.phenotype;
    comments.push(...gridRes.comments);

    // Step 8: Chylomicron Assessment
    if (labs.chyloTg >= 30 && labs.chyloTg <= 100) {
      comments.push("CV60");
    } else if (labs.chyloTg > 100) {
      if (["Type IV", "Type V", "Mild Int IV/V", "Int IV/V"].includes(phenotype)) {
        let chyloRes = evalChyloTable(labs.chyloTg, labs.vldlTg);
        phenotype = chyloRes.phenotype;
        comments.push(...chyloRes.comments);
      } else {
        comments.push("CV60");
      }
    }

    comments = [...new Set(comments)];
    rationale = gridRes.rationale + (idlSubtracted ? " IDL was subtracted per Step 7." : "");

    return { labs, phenotype, comments, rationale, cDiffStatus };
  }

  function lookupGrid(ldl, vldlTg, idlSubtracted) {
    let comments = [];
    let phenotype = "";
    let rationale = "";

    if (ldl < 30) {
      if (vldlTg < 120) { phenotype = "Not a Fredrickson Phenotype"; comments.push("CV55", "CV70"); }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 99) {
      if (vldlTg < 120) { phenotype = "Normal"; }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 129) {
      if (vldlTg < 120) { phenotype = "Normal"; }
      else if (vldlTg <= 250) { phenotype = "Mild Type IV"; }
      else { phenotype = "Type IV or V"; }
    } else if (ldl <= 159) {
      if (vldlTg < 120) { phenotype = "Not a Fredrickson Phenotype"; comments.push("CV55"); }
      else if (vldlTg <= 250) { phenotype = "Mild Type IIb"; }
      else { phenotype = "Type IV"; comments.push("CV73"); }
    } else if (ldl <= 189) {
      if (vldlTg < 120) { phenotype = "Mild Type IIa"; }
      else {
        phenotype = "Mild Type IIb";
        comments.push("CV67");
      }
    } else {
      if (vldlTg < 120) {
        phenotype = "Type IIa";
        if (!idlSubtracted) comments.push("CV62");
      } else {
        phenotype = "Type IIb";
        if (!idlSubtracted) comments.push("CV63");
      }
    }

    rationale = `Mapped to [LDL: ${Math.round(ldl)}, VLDL-Tg: ${vldlTg}] on Profile Grid.`;
    return { phenotype, comments, rationale };
  }

  function evalChyloTable(chyloTg, vldlTg) {
    let comments = [];
    let phenotype = "";
    if (chyloTg < 100) {
      phenotype = "Type IV";
      comments.push("CV60");
    } else if (chyloTg <= 300) {
      if (vldlTg <= 250) phenotype = "Mild Int IV/V";
      else { phenotype = "Int IV/V"; comments.push("CV57", "CV61"); }
    } else {
      phenotype = "Type V";
      comments.push("CV61");
    }
    return { phenotype, comments };
  }

  function renderLabs() {
    const l = currentCase.labs;

    const isHigh = (val, threshold) => val > threshold;
    const isHdlLow = (hdl, sex) => (sex === 'Male' && hdl < 40) || (sex === 'Female' && hdl < 50);

    const labsDisplay = [
      { label: "Age", val: `${l.age}`, flag: "" },
      { label: "Sex", val: `${l.sex}`, flag: "" },
      { label: "Total Cholesterol", val: `${l.tc} mg/dL`, flag: isHigh(l.tc, 200) ? "HIGH" : "" },
      { label: "Total Triglycerides", val: `${l.biochemTrig} mg/dL`, flag: isHigh(l.biochemTrig, 150) ? "HIGH" : "" },
      { label: "Lp(a) Cholesterol", val: `${l.lpla} mg/dL`, flag: isHigh(l.lpla, 5) ? "HIGH" : "" },
      { label: "LDL Cholesterol", val: `${l.ldlC} mg/dL`, flag: isHigh(l.ldlC, 100) ? "HIGH" : "" },
      { label: "LDL Triglycerides", val: `${l.ldlTg} mg/dL`, flag: isHigh(l.ldlTg, 50) ? "HIGH" : "" },
      { label: "Apolipoprotein B", val: `${l.apob} mg/dL`, flag: isHigh(l.apob, 90) ? "HIGH" : "" },
      { label: "HDL Cholesterol", val: `${l.hdlC} mg/dL`, flag: isHdlLow(l.hdlC, l.sex) ? "LOW" : "" },
      { label: "VLDL Cholesterol", val: `${l.vldlC} mg/dL`, flag: isHigh(l.vldlC, 30) ? "HIGH" : "" },
      { label: "VLDL Triglycerides", val: `${l.vldlTg} mg/dL`, flag: isHigh(l.vldlTg, 120) ? "HIGH" : "" },
      { label: "Beta VLDL Cholesterol", val: `${l.bVldlC} mg/dL`, flag: isHigh(l.bVldlC, 15) ? "HIGH" : "" },
      { label: "Beta VLDL Triglycerides", val: `${l.bVldlTg} mg/dL`, flag: isHigh(l.bVldlTg, 15) ? "HIGH" : "" },
      { label: "Chylomicron Cholesterol", val: l.chyloC > 0 ? `${l.chyloC} mg/dL` : "Absent", flag: l.chyloC > 0 ? "HIGH" : "" },
      { label: "Chylomicron Triglycerides", val: l.chyloTg > 0 ? `${l.chyloTg} mg/dL` : "Absent", flag: l.chyloTg > 0 ? "HIGH" : "" },
      { label: "Lipoprotein X", val: l.lpx ? "POSITIVE" : "Negative", flag: l.lpx ? "HIGH" : "" },
      { label: "C-Diff Check", val: `${l.cDiff} (${currentCase.cDiffStatus})`, flag: "" }
    ];

    document.getElementById('lab-list').innerHTML = labsDisplay.map(d => {
      let flagSpan = "";
      if (d.flag === "HIGH") flagSpan = `<span class="flag flag-high">High</span>`;
      if (d.flag === "LOW") flagSpan = `<span class="flag flag-low">Low</span>`;

      return `
        <div class="lab-item">
          <span>${d.label}</span>
          <div>
            <strong>${d.val}</strong>
            ${flagSpan}
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('feedback').style.display = 'none';
  }

  function checkAnswer(selected) {
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';

    let commentListHtml = "<em>None</em>";
    if (currentCase.comments.length > 0) {
      commentListHtml = `<ul class="comment-list">` +
        currentCase.comments.map(c => `<li class="comment-item"><strong>${c}:</strong> ${cvDescriptions[c] || 'Comment'}</li>`).join('') +
        `</ul>`;
    }

    if (selected === currentCase.phenotype || (selected === "Type IV" && currentCase.phenotype.includes("IV"))) {
      fb.className = "feedback correct";
      fb.innerHTML = `<strong>Correct!</strong> Classification: <strong>${currentCase.phenotype}</strong><br><br>
                      <strong>Required BioChem Comments:</strong>${commentListHtml}<br>
                      <em>${currentCase.rationale}</em>`;
    } else {
      fb.className = "feedback incorrect";
      fb.innerHTML = `<strong>Incorrect.</strong> Decision flowchart yields: <strong>${currentCase.phenotype}</strong><br><br>
                      <strong>Required BioChem Comments:</strong>${commentListHtml}<br>
                      <em>${currentCase.rationale}</em>`;
    }
  }

  generateCase();
</script>
